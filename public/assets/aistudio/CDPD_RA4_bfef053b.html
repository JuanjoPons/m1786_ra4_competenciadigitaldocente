<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDPD RA4 · RA4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ds-allow-hardcode:start — full autònom: sense sistema de disseny extern; colors tokenitzats a :root */
:root{
  --ink:#10293a; --ink-2:#2c4556; --muted:#516776; --paper:#eef2f4; --surface:#ffffff; --line:#cfd9df; --line-2:#e3e9ec;
  --blue:#1d5aa0; --blue-bg:#e7eff9; --blue-ink:#123f73;
  --yellow:#f0c000; --yellow-bg:#fff5c7; --yellow-ink:#4a3a00;
  --green:#1b7343; --green-bg:#e3f3e9; --green-ink:#0f4d2b;
  --red:#b42318; --red-bg:#fdecea; --red-ink:#7a1710;
  --focus:#ff8a00;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-head:"Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --r-s:4px; --r-m:8px;
  --measure:72ch;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.15;margin:0;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:.5rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- capçalera ---------- */
.top{background:var(--ink);color:#fff}
.top-in{max-width:1240px;margin:0 auto;padding:14px 16px 0;display:grid;gap:10px}
.top-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand-mark{flex:none;width:46px;height:46px}
.brand h1{font-size:1.65rem;font-weight:700}
.brand p{margin:0;color:#c3d3dc;font-size:.92rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #6d8796;border-radius:var(--r-s);overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:.35rem .7rem;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.tbtn{background:transparent;border:1px solid #6d8796;color:#fff;border-radius:var(--r-s);padding:.35rem .7rem;cursor:pointer}
.tbtn:hover{border-color:#fff}
.tbtn.on{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);font-weight:700}
.daybar{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:#dbe6ec}
.daybar strong{color:#fff}
.student-chip{color:#fff;font-weight:700}
.student-chip.empty{color:#ffd48a;font-weight:400}

/* ruta de sessions */
.route{position:relative;display:flex;gap:0;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:thin}
.route button{flex:1 0 auto;min-width:118px;background:transparent;border:0;border-top:4px solid transparent;color:#c3d3dc;
  padding:.55rem .8rem .7rem;text-align:left;cursor:pointer;display:grid;gap:2px}
.route button:hover{color:#fff}
.route button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-top-color:var(--yellow)}
.route .rid{font-family:var(--f-head);font-weight:700;font-size:1.25rem;line-height:1}
.route .rmeta{font-size:.78rem;display:flex;gap:6px;align-items:center}
.dotp{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.dotp.part{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.dotp.full{background:currentColor}

/* ---------- disposició ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 64px}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.grid > *,.top-in > *{min-width:0}
@media (max-width:900px){.grid{grid-template-columns:1fr}.toc{position:static!important;max-height:none!important}}
.toc{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.toc h2{font-size:1.05rem;margin-bottom:6px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:flex;gap:6px;padding:4px 6px;border-radius:var(--r-s);text-decoration:none;color:var(--ink-2)}
.toc li a:hover{background:var(--paper)}
.toc .tk{flex:none;width:8px;margin-top:8px;height:8px;border-radius:2px;background:var(--line)}
.toc .tk.activity,.toc .tk.selfcheck{background:var(--blue)}
.toc .tk.summary{background:var(--ink)}
.toc details{margin-top:4px}
.toc summary{cursor:pointer;min-height:28px;display:list-item;padding:2px 0}
@media (max-width:900px){.toc details:not([open]) ol{display:none}}

.main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:1.5rem;margin-bottom:10px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.92rem}
.field input,.field textarea,.field select{border:1px solid #9aabb6;border-radius:var(--r-s);padding:.5rem .6rem;background:#fff;width:100%}
.field textarea{min-height:5.5rem;resize:vertical}
.hint{color:var(--muted);font-size:.88rem;margin:.2rem 0 0}
.req{color:var(--red)}

/* capçalera de sessió */
.shead{display:grid;gap:10px;margin-bottom:18px}
.shead .kicker{font-family:var(--f-head);font-size:1.15rem;color:var(--muted);font-weight:600}
.shead h2{font-size:clamp(2rem,4.2vw,3rem);font-weight:700;max-width:24ch}
.metas{display:flex;flex-wrap:wrap;gap:8px}
.meta{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:.25rem .55rem;font-size:.86rem}
.meta b{font-weight:700}
.meta.warn{border-color:var(--yellow);background:var(--yellow-bg);color:var(--yellow-ink)}

/* seccions de contingut */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:14px;padding:18px 22px;scroll-margin-top:12px}
.sec > h3{font-size:1.45rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.sec > h3 .n{color:var(--muted);font-weight:600;min-width:1.6em}
.kindtag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-body);font-size:.78rem;font-weight:700;padding:.1rem .45rem;border-radius:var(--r-s);
  background:var(--paper);color:var(--ink-2);vertical-align:middle;margin-left:auto;white-space:nowrap}
.kindtag svg{width:14px;height:14px}
.sec.k-example{border-left:6px solid #6b8aa0}
.sec.k-objectives{border-left:6px solid var(--ink)}
.sec.k-summary{background:#f6f9fb;border-left:6px solid var(--ink)}
.sec.k-activity,.sec.k-selfcheck{border-left:6px solid var(--blue)}
.prose{max-width:none}
.prose > p,.prose > h4,.prose > ul:not(.bal),.prose > ol:not(.bal):not(.arrows),.prose > .flow,.prose > .box,.prose > .tablewrap{max-width:var(--measure)}
.prose p{margin:.45rem 0}
.prose h4{font-size:1.2rem;margin:1rem 0 .3rem;color:var(--ink-2)}
.prose ul,.prose ol{margin:.35rem 0 .6rem;padding-left:1.4rem}
.prose li{margin:.15rem 0}
.prose li::marker{color:var(--muted)}
.prose .l2{padding-left:2.6rem}
.prose .l0{padding-left:1.6rem}
.tablewrap{overflow-x:auto;margin:.7rem 0;border:1px solid var(--line);border-radius:var(--r-s)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:.45rem .6rem;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
thead th{background:var(--ink);color:#fff;font-weight:700}
tbody tr:nth-child(even) td{background:#f7f9fa}
.flow{display:grid;justify-items:start;gap:0;margin:.8rem 0;padding:.2rem 0}
.flow .st{border:2px solid var(--ink);border-radius:var(--r-s);padding:.3rem .7rem;font-weight:700;background:#fff;max-width:var(--measure)}
.flow .ar{width:2px;height:14px;background:var(--ink);margin-left:22px;position:relative}
.flow .ar::after{content:"";position:absolute;bottom:-5px;left:-4px;border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.flow .tx{padding:.15rem 0 .15rem .3rem;color:var(--ink-2)}
details.assess{margin-top:.4rem}
details.assess > summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
.srcnote{font-size:.82rem;color:var(--muted);margin-top:.6rem}

/* vídeos */
.video{display:grid;grid-template-columns:auto 1fr;gap:12px;border:1px dashed #8aa0ad;border-radius:var(--r-m);padding:12px 14px;margin:12px 0;background:#f8fafb}
.video .vi{width:40px;height:40px;border-radius:var(--r-s);background:var(--ink);color:#fff;display:grid;place-items:center}
.video h4{font-size:1.15rem;margin-bottom:2px}
.video .vm{font-size:.86rem;color:var(--muted)}
.video .ver{font-weight:700;font-size:.8rem;padding:.05rem .35rem;border-radius:var(--r-s)}
.video .ver.ok{background:var(--green-bg);color:var(--green-ink)}
.video .ver.no{background:var(--yellow-bg);color:var(--yellow-ink)}

/* ---------- activitats ---------- */
.act{border:2px solid var(--line);border-radius:var(--r-m);margin:14px 0;background:#fff;overflow:hidden}
.act-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.act-h h4{font-size:1.25rem;flex:1 1 260px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;padding:.2rem .5rem;border-radius:var(--r-s);white-space:nowrap}
.badge svg{width:16px;height:16px;flex:none}
.act.t-auto{border-color:var(--blue)} .act.t-auto .act-h{background:var(--blue-bg)} .b-auto{background:var(--blue);color:#fff}
.act.t-teacher{border-color:var(--yellow)} .act.t-teacher .act-h{background:var(--yellow-bg)} .b-teacher{background:var(--yellow);color:#231b00}
.act.t-class{border-color:var(--green)} .act.t-class .act-h{background:var(--green-bg)} .b-class{background:var(--green);color:#fff}
.b-origin{background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:400}
.act-b{padding:12px 14px}
.act-meta{font-size:.84rem;color:var(--muted);margin:0 0 8px}
.instr{margin:0 0 10px;max-width:var(--measure)}
.q{border-top:1px solid var(--line-2);padding:10px 0}
.q:first-of-type{border-top:0}
.q legend,.q .ql{font-weight:700;padding:0;margin-bottom:6px;max-width:var(--measure)}
fieldset.q{border:0;margin:0;min-width:0;border-top:1px solid var(--line-2)}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:var(--r-s);cursor:pointer;max-width:var(--measure)}
.opt:hover{background:var(--paper)}
.opt input{margin-top:.35rem;width:18px;height:18px;flex:none}
.opt.is-right{background:var(--green-bg)}
.opt.is-wrong{background:var(--red-bg)}
.fb{margin-top:6px;padding:6px 10px;border-radius:var(--r-s);font-size:.95rem;display:flex;gap:8px;align-items:flex-start}
.fb svg{width:18px;height:18px;flex:none;margin-top:3px}
.fb.ok{background:var(--green-bg);color:var(--green-ink)}
.fb.ko{background:var(--red-bg);color:var(--red-ink)}
.row-sel{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,280px) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
@media (max-width:620px){.row-sel{grid-template-columns:1fr}}
.row-sel select{border:1px solid #9aabb6;border-radius:var(--r-s);padding:.4rem;background:#fff;width:100%}
.mark{font-weight:700;font-size:.85rem;display:inline-flex;gap:4px;align-items:center}
.mark.ok{color:var(--green)} .mark.ko{color:var(--red)}
.mark svg{width:16px;height:16px}
.order li{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-s);margin:6px 0;background:#fff}
.order{list-style:none;padding:0;margin:0;counter-reset:o}
.order li::before{counter-increment:o;content:counter(o);font-family:var(--f-head);font-weight:700;font-size:1.2rem;min-width:1.4em;color:var(--muted)}
.order .ot{flex:1}
.order button{border:1px solid #9aabb6;background:#fff;border-radius:var(--r-s);width:34px;height:34px;cursor:pointer}
.order button:disabled{opacity:.35;cursor:default}
.order li.ok{border-color:var(--green);background:var(--green-bg)}
.order li.ko{border-color:var(--red);background:var(--red-bg)}
.act-f{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#fafbfc}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-s);padding:.45rem .9rem;font-weight:700;cursor:pointer}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:var(--paper)}
.btn.big{font-size:1.05rem;padding:.6rem 1.1rem}
.btn.warn{background:#fff;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.score{font-weight:700}
.scorebox{font-size:.92rem;color:var(--ink-2)}
.how{font-size:.82rem;color:var(--muted);width:100%}
.gridin{width:100%;border-collapse:collapse}
.gridin td,.gridin th{border:1px solid var(--line);padding:4px}
.gridin textarea{width:100%;min-height:3.2rem;border:0;resize:vertical;padding:4px}
.status{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:.86rem;padding:.15rem .5rem;border-radius:var(--r-s);border:1px solid var(--line)}
.status.pend{background:#fff}
.status.lliu{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-ink)}
.status.rev{background:var(--green-bg);border-color:var(--green);color:var(--green-ink)}
.tbox{margin-top:12px;border:2px dashed var(--yellow);border-radius:var(--r-m);padding:10px 12px;background:#fffcf0}
.tbox h5{margin:0 0 6px;font-family:var(--f-head);font-size:1.1rem}
.tbox .ro{color:var(--muted);font-style:italic}
.tbox .form-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.chk{display:flex;gap:8px;align-items:center;font-weight:700}
.chk input{width:20px;height:20px}

.nav-s{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.final-h{font-size:1.6rem;margin:26px 0 8px}

/* banda del docent */
.tband{background:var(--yellow);color:#231b00;font-weight:700;text-align:center;padding:6px 12px;font-size:.92rem}

/* progrés */
.prog-table td,.prog-table th{white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden;min-width:90px}
.bar > i{display:block;height:100%;background:var(--blue)}

/* informe */
.overlay{position:fixed;inset:0;background:rgba(10,25,35,.55);z-index:50;display:none;overflow:auto;padding:24px 12px}
.overlay.open{display:block}
.sheet{max-width:900px;margin:0 auto;background:#fff;border-radius:var(--r-m);padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet-top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-size:1.9rem}
.rep h3{font-size:1.35rem;margin:18px 0 6px;border-bottom:2px solid var(--ink);padding-bottom:3px}
.rep h4{font-size:1.1rem;margin:12px 0 4px}
.rep table{font-size:.88rem}
.rep .src-a{color:var(--blue-ink);font-weight:700}
.rep .src-t{color:#6b5300;font-weight:700}
.rep .ans{white-space:pre-wrap;background:#f6f8f9;border-left:3px solid var(--line);padding:4px 8px;margin:4px 0;font-size:.88rem}
.legend{font-size:.86rem;border:1px solid var(--line);padding:6px 10px;border-radius:var(--r-s);background:#f8fafb}
#copyfallback{width:100%;min-height:240px;font:400 .85rem/1.4 ui-monospace,Menlo,monospace;margin-top:10px;display:none}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:var(--r-s);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:92vw}
#toast.show{opacity:1}
.foot{max-width:1240px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.86rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  body.print-report .top,body.print-report .wrap,body.print-report .foot,body.print-report .tband,body.print-report .sheet-top,body.print-report #toast{display:none!important}
  body.print-report .overlay{position:static;display:block;background:none;padding:0}
  body.print-report .sheet{box-shadow:none;padding:0;max-width:none}
  .rep h3{break-after:avoid}
  .rep tr{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}

/* ---------- portada de bloc (placa de senyalització) ---------- */
.cover{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 26px;background:var(--ink);color:#fff;border-radius:var(--r-m);
  padding:22px 24px 34px;overflow:hidden}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;
  background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
.cv-id{display:grid;align-content:start;gap:2px}
.cv-code{font-family:var(--f-head);font-weight:700;font-size:clamp(3.4rem,8vw,5.6rem);line-height:.86;color:var(--yellow);letter-spacing:-.01em}
.cv-sub{font-size:.84rem;color:#c3d3dc;white-space:nowrap}
.cv-main{min-width:0;display:grid;gap:10px;align-content:start}
.cover h2{font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:700;max-width:28ch;color:#fff}
.cv-lead{margin:0;color:#dbe6ec;max-width:60ch}
.cv-signs{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 18px}
.cv-signs li{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;color:#fff;max-width:15rem;line-height:1.25}
.cv-signs .sign{width:46px;height:46px}
.cv-art{width:170px;align-self:end;margin:-6px 0 -22px;line-height:0}
.cv-art svg{width:100%;height:auto}
.anim .cover:not(.in) .cv-art{opacity:0}
.anim .cover.in .cv-art{animation:rise .7s cubic-bezier(.2,.7,.2,1) both .1s}
@media (max-width:980px){.cv-art{width:130px}}
@media (max-width:760px){.cv-art{display:none}}
@media (max-width:620px){.cover{grid-template-columns:1fr;padding:18px 16px 30px}.cv-sub{white-space:normal}}
.pres-btn{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.pres-btn svg{width:16px;height:16px}

/* senyals */
.sign{display:inline-block;flex:none;width:44px;height:44px;line-height:0}
.sign svg{width:100%;height:100%;overflow:visible}

/* ---------- infografies ---------- */
.viz{margin:14px 0 16px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:#f7fafb}
.viz-t{font-size:1.15rem;margin:0 0 10px;color:var(--ink)}
.viz figcaption{font-size:.84rem;color:var(--muted);margin-top:8px}
.ct{display:grid;gap:2px;min-width:0}
.ct strong{font-family:var(--f-head);font-size:1.12rem;line-height:1.15;font-weight:700}
.ct span{font-size:.92rem;color:var(--ink-2);line-height:1.4}
.num{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-head);font-weight:700;font-size:1.2rem}

/* cadena de procés */
.chain{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0}
.chain li{position:relative;display:grid;justify-items:center;text-align:center;gap:8px;padding:4px 14px}
.chain li + li::before{content:"";position:absolute;left:-9px;top:20px;width:18px;height:3px;background:var(--ink)}
.chain li + li::after{content:"";position:absolute;left:5px;top:15px;border:6.5px solid transparent;border-left:8px solid var(--ink)}
.chain .ct{justify-items:center}
@media (max-width:760px){

/* passos verticals */

.card.s-ghs{border-top-color:var(--red)} .card.s-warn{border-top-color:var(--yellow)} .card.s-must{border-top-color:var(--blue)} .card.s-ban,.card.s-fire{border-top-color:var(--red)} .card.s-safe{border-top-color:var(--green)}

/* comparació */
.compare{display:grid;gap:10px;align-items:stretch}

.compare .col{background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:12px;border-left:6px solid var(--ink)}
.compare .col.s-warn{border-left-color:var(--yellow)} .compare .col.s-must{border-left-color:var(--blue)} .compare .col.s-ban,.compare .col.s-fire{border-left-color:var(--red)} .compare .col.s-safe{border-left-color:var(--green)}

/* piràmide (jerarquia) */
.pyr ol{list-style:none;margin:0 auto;padding:0;display:grid;gap:5px;justify-items:center}

/* cicle */
.cycle{list-style:none;margin:0 auto;padding:0;position:relative;width:min(100%,460px);aspect-ratio:1}

  background:#f7fafb;padding:4px}

/* xifra o definició clau */

.keyf.s-warn blockquote{border-left-color:var(--yellow)} .keyf.s-must blockquote{border-left-color:var(--blue)} .keyf.s-ban blockquote,.keyf.s-fire blockquote{border-left-color:var(--red)} .keyf.s-safe blockquote{border-left-color:var(--green)}

/* barres */

/* procés del manual (diagrames ↓) */
.flow .st{position:relative}

/* ---------- animació d'entrada (un sol cop) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}

.anim .viz:not(.in) li,.anim .viz:not(.in) .col,.anim .viz:not(.in) .keyf,.anim .viz:not(.in) td,
.anim .flow:not(.in) > *,.anim .terms:not(.in) li,.anim .cover:not(.in) .cv-signs li{opacity:0}
.anim .viz.in li,.anim .viz.in .col,.anim .viz.in .keyf,.anim .terms.in li{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 110ms)}

.anim .viz.in .bt i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 120ms + 150ms)}
.anim .flow.in > *{animation:rise .45s ease-out both}
.anim .flow.in > :nth-child(2){animation-delay:.12s} .anim .flow.in > :nth-child(3){animation-delay:.24s} .anim .flow.in > :nth-child(4){animation-delay:.36s}
.anim .flow.in > :nth-child(5){animation-delay:.48s} .anim .flow.in > :nth-child(6){animation-delay:.6s} .anim .flow.in > :nth-child(7){animation-delay:.72s}

<script>
window.COURSE={"day":1786,"file":"CDPD_RA4.html","langs":["es"],"meta":{"title":["Competencia digital para la práctica docente"],"subtitle":["MPCDPD (1786) · RA4 · Evaluación del proceso de enseñanza-aprendizaje mediante tecnologías digitales · 4 sesiones de 1 hora"],"short":"CDPD RA4","key":"mpcdpd1786ra4","sessionLength":["1 hora"],"curriculum":true,"curriculumLabel":"Resultado de aprendizaje","theme":"digital","figure":"teacher"},"ui":{"es":{"day":"Módulo","blocks":"Sesiones","uds":"Resultados de aprendizaje","rDay":"Sesiones incluidas","progTitle":"Progreso del RA4","report":"INFORME COMPLETO (RA4)","rNoGlobal":"La web no calcula una calificación final del RA: muestra el resultado de cada actividad. La calificación la determina el docente con sus instrumentos de evaluación.","fromManual":"Actividad del manual","complementary":"Complementaria (basada en el manual)","clearConfirm":"Se borrarán todas las respuestas, resultados y datos de identificación de esta web en este navegador. ¿Quieres continuar?","importBad":"El archivo no corresponde a esta web.","pending":"RA pendiente de identificar","idHint":"Escribe tu nombre y apellidos y tu grupo: aparecen en el informe que entregas al docente. No hace falta ningún otro dato personal."}},"blocks":[{"id":"S14","ud":"RA4","title":["Instrumentos digitales de evaluación diagnóstica, formativa y sumativa"],"meta":{"ra_fp":"RA4"},"sections":[{"num":0,"kind":"intro","title":["Evaluación del proceso de enseñanza-aprendizaje mediante tecnologías digitales"],"nodes":[{"t":"p","x":["Tras haber abordado en los capítulos anteriores la comunicación institucional, la gestión de contenidos y la integración pedagógica de las tecnologías digitales en el desarrollo de las sesiones formativas, corresponde ahora analizar su aplicación a uno de los procesos más determinantes de la labor docente: la evaluación. Las tecnologías digitales han transformado de manera profunda la manera en que se diseñan los instrumentos de evaluación, se recogen y analizan las evidencias del aprendizaje, se protege la información generada y se ofrece retroalimentación al alumnado. Este capítulo desarrolla estos aspectos, prestando especial atención al papel emergente de la inteligencia artificial en el tratamiento de los datos evaluativos, a la resolución de los problemas que puede plantear la integración tecnológica en la evaluación, y a la configuración de entornos virtuales orientados específicamente a la gestión de este proceso."]}],"acts":[],"videos":[]},{"num":1,"kind":"theory","title":["Instrumentos digitales de evaluación diagnóstica, formativa y sumativa"],"nodes":[{"t":"p","x":["La incorporación de tecnologías digitales al proceso de evaluación no debe entenderse como una simple digitalización de instrumentos tradicionales, sino como una oportunidad para enriquecer y diversificar las formas en que se recoge información sobre el aprendizaje del alumnado. Antes de profundizar en los instrumentos concretos, resulta necesario que el docente mantenga una actitud de reflexión crítica sobre las ventajas e inconvenientes que el uso de estas tecnologías comporta en cada momento del proceso evaluador."]},{"t":"p","x":["Entre las ventajas más evidentes se encuentran la rapidez en la corrección de determinadas pruebas, la posibilidad de ofrecer retroalimentación inmediata, la facilidad para almacenar y comparar resultados a lo largo del tiempo, o la posibilidad de diversificar los formatos de evaluación más allá de la prueba escrita convencional. Entre los inconvenientes cabe señalar el riesgo de sobrevalorar aquello que resulta fácilmente medible por medios digitales en detrimento de aprendizajes más complejos y difíciles de cuantificar, la posible brecha digital entre el alumnado, o la dependencia de una infraestructura tecnológica que no siempre resulta fiable. Esta reflexión crítica debe acompañar cualquier decisión relativa al uso de tecnologías digitales en la evaluación, evitando tanto el rechazo sistemático como la adopción acrítica de cualquier herramienta disponible."]},{"t":"viz","v":{"type":"compare","vs":true,"title":["1. Reflexión crítica"],"cols":[{"i":"check","s":"safe","x":["Ventajas"],"items":[["Rapidez en la corrección"],["Retroalimentación inmediata"],["Almacenar y comparar resultados"],["Diversificar los formatos de evaluación"]]},{"i":"alert","s":"warn","x":["Inconvenientes"],"items":[["Sobrevalorar lo fácilmente medible"],["Brecha digital entre el alumnado"],["Dependencia de una infraestructura no siempre fiable"]]}]}},{"t":"p","x":["Sobre esta base reflexiva, el docente debe emplear las tecnologías y herramientas digitales de forma sistemática e intencionada, siguiendo en todo momento el protocolo de seguridad establecido por el centro educativo. Esta sistematicidad implica que el uso de la tecnología en la evaluación no responda a decisiones improvisadas, sino a una planificación coherente con los objetivos evaluativos perseguidos en cada momento del proceso formativo, y que dicho uso se ajuste a las normas de seguridad informática vigentes, como la utilización de credenciales de acceso individualizadas, el cierre de sesión tras el uso de dispositivos compartidos, o la actualización periódica de los sistemas empleados."]},{"t":"viz","v":{"type":"cards","title":["2. Uso sistemático y seguro: normas de seguridad informática"],"items":[{"i":"user","s":"must","x":["Credenciales de acceso individualizadas"]},{"i":"exit","s":"must","x":["Cierre de sesión en dispositivos compartidos"]},{"i":"cycle","s":"must","x":["Actualización periódica de los sistemas"]}]}},{"t":"p","x":["A partir de estas consideraciones generales, corresponde al docente crear medios, recursos e instrumentos de evaluación adaptados a las tres grandes funciones que puede cumplir la evaluación dentro del proceso formativo. La evaluación diagnóstica, realizada al inicio de una acción formativa o de una unidad didáctica, permite conocer los conocimientos previos, las expectativas y las posibles dificultades del alumnado, y puede apoyarse en herramientas digitales como cuestionarios de autoevaluación inicial, encuestas de sondeo de conocimientos previos o actividades interactivas de diagnóstico rápido. La evaluación formativa, desarrollada a lo largo de todo el proceso de enseñanza-aprendizaje, tiene como finalidad principal proporcionar información continuada sobre el progreso del alumnado con el objeto de ajustar la práctica docente, y puede materializarse en instrumentos digitales como murales digitales, que permiten visualizar de forma colaborativa las aportaciones del alumnado a lo largo de un proceso de trabajo; portafolios digitales, que recogen de manera organizada las evidencias del proceso de aprendizaje de cada alumno o alumna a lo largo del tiempo; listas digitales de control, que facilitan el seguimiento sistemático de la adquisición de determinados desempeños; o rúbricas en entorno virtual, que permiten valorar de forma estructurada y transparente el grado de consecución de los criterios de evaluación establecidos. Finalmente, la evaluación sumativa, orientada a valorar el grado de consecución de los resultados de aprendizaje al término de un proceso formativo, puede apoyarse igualmente en instrumentos digitales que permitan una corrección más ágil y una mayor trazabilidad de los resultados obtenidos."]},{"t":"viz","v":{"type":"compare","title":["3. Tres funciones de la evaluación y sus herramientas digitales"],"cols":[{"i":"search","s":"info","x":["Diagnóstica (inicio)"],"items":[["Conocimientos previos, expectativas y dificultades"],["Cuestionarios de autoevaluación inicial"],["Encuestas de sondeo"],["Actividades interactivas de diagnóstico rápido"]]},{"i":"cycle","s":"info","x":["Formativa (proceso)"],"items":[["Información continuada para ajustar la práctica"],["Murales digitales"],["Portafolios digitales"],["Listas digitales de control"],["Rúbricas en entorno virtual"]]},{"i":"target","s":"info","x":["Sumativa (final)"],"items":[["Grado de consecución de los resultados de aprendizaje"],["Corrección más ágil"],["Mayor trazabilidad de los resultados"]]}],"note":["Recoge la infografía «4.1 Instrumentos digitales de evaluación» del manual."]}}],"acts":["S14-fun","S14-vi","S14-A12"],"videos":[]}],"final":[],"acts":[{"id":"S14-fun","type":"classify","time":["7 min"],"title":["¿En qué función de la evaluación encaja?"],"instr":["Clasifica cada instrumento o finalidad en la función de la evaluación con la que lo relaciona el epígrafe 1."],"cats":[["Diagnóstica"],["Formativa"],["Sumativa"]],"items":[{"x":["Encuesta de sondeo de conocimientos previos al empezar la unidad."],"c":0,"exp":["Se realiza al inicio para conocer conocimientos previos."]},{"x":["Cuestionario de autoevaluación inicial."],"c":0,"exp":["Herramienta de la evaluación diagnóstica."]},{"x":["Portafolio digital con las evidencias de cada alumno a lo largo del tiempo."],"c":1,"exp":["Instrumento de la evaluación formativa."]},{"x":["Mural digital con las aportaciones del grupo durante un proceso de trabajo."],"c":1,"exp":["Instrumento de la evaluación formativa."]},{"x":["Lista digital de control de la adquisición de desempeños."],"c":1,"exp":["Instrumento de la evaluación formativa."]},{"x":["Prueba final para valorar la consecución de los resultados de aprendizaje."],"c":2,"exp":["La evaluación sumativa se orienta a valorar el grado de consecución al término del proceso."]}],"block":"S14","origin":"complementaria","ra":"RA4","ce":""},{"id":"S14-vi","type":"classify","time":["5 min"],"title":["¿Ventaja o inconveniente?"],"instr":["Clasifica cada aspecto del uso de tecnologías digitales en la evaluación según el epígrafe 1."],"cats":[["Ventaja"],["Inconveniente"]],"items":[{"x":["Rapidez en la corrección de determinadas pruebas."],"c":0,"exp":["Primera ventaja citada."]},{"x":["Sobrevalorar lo fácilmente medible frente a aprendizajes complejos."],"c":1,"exp":["Primer inconveniente citado."]},{"x":["Ofrecer retroalimentación inmediata."],"c":0,"exp":["Ventaja citada."]},{"x":["Posible brecha digital entre el alumnado."],"c":1,"exp":["Inconveniente citado."]},{"x":["Diversificar los formatos más allá de la prueba escrita."],"c":0,"exp":["Ventaja citada."]},{"x":["Depender de una infraestructura tecnológica no siempre fiable."],"c":1,"exp":["Inconveniente citado."]}],"block":"S14","origin":"complementaria","ra":"RA4","ce":""},{"id":"S14-A12","type":"teacher","origin":"manual","time":["30 min"],"timeManual":["50 minutos"],"kind":["Diseño de instrumentos de evaluación"],"group":["Individual"],"mode":["Presencial o virtual"],"ce":"a), b), c)","title":["Actividad 12. Tres instrumentos digitales para una unidad didáctica"],"instr":["Selecciona una unidad didáctica concreta de tu familia profesional y diseña, para las tres fases del proceso evaluador, un instrumento digital adecuado a cada una: un instrumento de evaluación diagnóstica inicial, un instrumento de evaluación formativa a lo largo del desarrollo de la unidad, y un instrumento de evaluación sumativa final. Para cada instrumento, especifica qué información concreta pretendes recoger, qué protocolo de seguridad aplicarías en su uso, y qué ventaja e inconveniente concretos identificas en el empleo de la tecnología digital elegida frente a un instrumento equivalente en soporte tradicional."],"grid":{"cols":[["Fase"],["Instrumento digital"],["Información que recoge"],["Protocolo de seguridad"],["Ventaja / inconveniente frente al soporte tradicional"]],"rows":3},"fields":[["Unidad didáctica elegida de tu familia profesional."]],"rubric":["Una fila por fase: diagnóstica inicial, formativa durante la unidad y sumativa final."],"block":"S14","ra":"RA4"}],"notes":[],"cover":{"signs":[["warn","scale",["Reflexión crítica: ventajas e inconvenientes"]],["must","lock",["Uso sistemático y seguro"]],["info","search",["Diagnóstica: al inicio"]],["info","cycle",["Formativa: durante el proceso"]],["info","target",["Sumativa: al término"]]],"lead":["La incorporación de tecnologías digitales a la evaluación no debe entenderse como una simple digitalización de instrumentos tradicionales."]},"art":"checklist"},{"id":"S15","ud":"RA4","title":["Tratamiento de datos y evidencias digitales de evaluación con TIC e IA"],"meta":{"ra_fp":"RA4"},"sections":[{"num":2,"kind":"theory","title":["Tratamiento de datos y evidencias digitales de evaluación con TIC e IA"],"nodes":[{"t":"p","x":["El uso de tecnologías digitales en la evaluación genera, de manera casi inevitable, un volumen creciente de datos sobre el desempeño del alumnado: calificaciones, tiempos de realización de las pruebas, interacciones registradas en el entorno virtual, patrones de participación en actividades colaborativas, entre otros muchos indicadores. El docente debe conocer y aplicar el procedimiento adecuado para recabar, tratar, almacenar, analizar e interpretar estos datos, empleando tanto las tecnologías de la información y la comunicación convencionales como las herramientas basadas en inteligencia artificial que, de manera creciente, se incorporan a las plataformas educativas."]},{"t":"viz","v":{"type":"chain","title":["Procedimiento para los datos de evaluación"],"items":[{"i":"folder","s":"info","x":["Recabar"]},{"i":"gear","s":"info","x":["Tratar"]},{"i":"cloud","s":"info","x":["Almacenar"]},{"i":"chart","s":"info","x":["Analizar"]},{"i":"bulb","s":"safe","x":["Interpretar"]}]}},{"t":"p","x":["La inteligencia artificial aplicada a la evaluación educativa ofrece posibilidades de gran interés, como la identificación automática de patrones de dificultad en determinados contenidos a partir del análisis masivo de respuestas del alumnado, la generación de informes personalizados de progreso, o la detección temprana de indicios de desenganche o abandono formativo a partir del análisis de la actividad registrada en el entorno virtual. No obstante, el uso de estas herramientas exige del docente una actitud especialmente prudente y crítica, dado que los sistemas de inteligencia artificial no están exentos de limitaciones ni de posibles sesgos derivados de los datos con los que han sido entrenados. Por ello, cualquier conclusión obtenida mediante estas herramientas debe ser siempre contrastada con el criterio pedagógico del docente, que conserva en todo caso la responsabilidad última sobre las decisiones evaluativas adoptadas, sin que la tecnología pueda sustituir dicho criterio profesional."]},{"t":"viz","v":{"type":"compare","title":["La inteligencia artificial en la evaluación"],"cols":[{"i":"brain","s":"safe","x":["Posibilidades"],"items":[["Patrones de dificultad a partir de muchas respuestas"],["Informes personalizados de progreso"],["Detección temprana de desenganche o abandono"]]},{"i":"alert","s":"warn","x":["Precauciones"],"items":[["Limitaciones y posibles sesgos de los datos de entrenamiento"],["Contrastar siempre con el criterio pedagógico"],["La responsabilidad última es del docente"]]}]}},{"t":"p","x":["A partir de la información recabada, el docente debe analizar e interpretar las evidencias digitales disponibles sobre las actividades, el rendimiento y el progreso del alumnado, con el objetivo explícito de mejorar el proceso de enseñanza-aprendizaje. Este análisis no debe limitarse a una lectura superficial de las calificaciones obtenidas, sino que debe permitir identificar patrones más profundos: qué contenidos generan mayores dificultades de forma generalizada en el grupo, qué alumnado presenta un ritmo de progreso distinto al esperado, o qué actividades resultan especialmente eficaces para la consolidación de determinados aprendizajes. Esta interpretación cualificada de las evidencias digitales constituye, en definitiva, la base sobre la que el docente puede fundamentar decisiones de mejora tanto a nivel individual, ajustando el acompañamiento ofrecido a cada alumno o alumna, como a nivel grupal, revisando la propia planificación didáctica cuando los datos así lo aconsejen."]},{"t":"viz","v":{"type":"compare","title":["Decisiones de mejora a partir de las evidencias"],"cols":[{"i":"user","s":"safe","x":["Nivel individual"],"items":[["Ajustar el acompañamiento ofrecido a cada alumno o alumna"]]},{"i":"group","s":"safe","x":["Nivel grupal"],"items":[["Revisar la propia planificación didáctica cuando los datos lo aconsejen"]]}]}}],"acts":["S15-ord","S15-ia","S15-A13"],"videos":[]}],"final":[],"acts":[{"id":"S15-ord","type":"order","time":["4 min"],"title":["Ordena el procedimiento con los datos de evaluación"],"items":[["Recabar"],["Tratar"],["Almacenar"],["Analizar"],["Interpretar"]],"exp":["Epígrafe 2: el docente debe conocer y aplicar el procedimiento adecuado para recabar, tratar, almacenar, analizar e interpretar los datos."],"block":"S15","origin":"complementaria","ra":"RA4","ce":""},{"id":"S15-ia","type":"tf","time":["6 min"],"title":["Verdadero o falso: IA y evidencias digitales"],"questions":[{"q":["La IA puede detectar pronto indicios de desenganche o abandono a partir de la actividad en el entorno virtual."],"ans":true,"exp":["Es una de las posibilidades que cita el epígrafe 2."]},{"q":["Los sistemas de IA están libres de sesgos, porque se basan en datos."],"ans":false,"exp":["No están exentos de limitaciones ni de sesgos derivados de los datos con los que han sido entrenados."]},{"q":["Si la IA lo indica, el docente puede delegar en ella la decisión de evaluación."],"ans":false,"exp":["El docente conserva siempre la responsabilidad última; la tecnología no sustituye su criterio profesional."]},{"q":["Analizar evidencias digitales consiste solo en leer las calificaciones obtenidas."],"ans":false,"exp":["Debe permitir identificar patrones más profundos (contenidos difíciles, ritmos distintos, actividades eficaces)."]},{"q":["Las evidencias pueden llevar a revisar la propia planificación didáctica."],"ans":true,"exp":["A nivel grupal, cuando los datos así lo aconsejen."]}],"block":"S15","origin":"complementaria","ra":"RA4","ce":""},{"id":"S15-A13","type":"teacher","origin":"manual","time":["35 min (informe 25 min + debate 10 min)"],"timeManual":["45 minutos"],"kind":["Análisis de datos y reflexión crítica"],"group":["Individual, con puesta en común posterior"],"mode":["Presencial o virtual"],"ce":"f), g)","title":["Actividad 13. Interpreto los resultados de una prueba formativa"],"instr":["Se te presenta el siguiente conjunto simplificado de datos, extraídos del entorno virtual de aprendizaje de un grupo de quince alumnos, correspondiente a los resultados de una prueba formativa sobre un contenido técnico: diez alumnos han superado la prueba con una puntuación media alta, tres alumnos han obtenido una puntuación baja y coinciden en haber fallado en el mismo bloque de preguntas, y dos alumnos no han llegado a completar la prueba dentro del plazo establecido. Redacta un breve informe, de aproximadamente una página, en el que interpretes estas evidencias digitales, propongas al menos dos hipótesis explicativas plausibles para los resultados obtenidos por los tres alumnos con puntuación baja, y describas qué medidas de mejora adoptarías tanto a nivel individual como en el conjunto de la planificación didáctica. Comparte tu análisis en un breve debate grupal, contrastando tus conclusiones con las de otros compañeros y compañeras."],"fields":[["Interpretación de las evidencias digitales (10 aprobados con media alta, 3 con puntuación baja en el mismo bloque, 2 sin completar)."],["Al menos dos hipótesis explicativas para los tres alumnos con puntuación baja."],["Medidas de mejora a nivel individual."],["Medidas de mejora en el conjunto de la planificación didáctica."],["Conclusiones del debate grupal."]],"rubric":["Extensión orientativa del informe: una página."],"block":"S15","ra":"RA4"}],"notes":[],"cover":{"signs":[["info","chart",["Recabar, tratar y almacenar datos"]],["info","brain",["IA: patrones e informes"]],["warn","alert",["Limitaciones y sesgos"]],["safe","learn",["Criterio pedagógico del docente"]]],"lead":["Cualquier conclusión obtenida mediante herramientas de inteligencia artificial debe ser siempre contrastada con el criterio pedagógico del docente."]},"art":"chart"},{"id":"S16","ud":"RA4","title":["Resolución de problemas, coordinación en equipo y protección de datos"],"meta":{"ra_fp":"RA4"},"sections":[{"num":3,"kind":"theory","title":["Resolución de problemas y coordinación en equipo en la integración de tecnologías digitales en la evaluación"],"nodes":[{"t":"p","x":["La integración de tecnologías digitales en el proceso evaluador no está exenta de dificultades, y el docente competente digitalmente debe estar preparado para afrontarlas con solvencia. Estas dificultades pueden ser de naturaleza muy diversa: técnicas, como fallos de conexión durante una prueba en línea o incompatibilidades entre plataformas; organizativas, como la coordinación necesaria entre distintos docentes que evalúan a un mismo grupo de alumnado; o pedagógicas, como la necesidad de adaptar un instrumento digital diseñado para un contexto que no se ajusta plenamente a la realidad concreta del aula. Corresponde al docente resolver los problemas que surjan al integrar estas tecnologías en las acciones formativas que desarrolla, aplicando para ello tanto conocimientos técnicos básicos como estrategias de gestión de la incertidumbre propias de cualquier profesional que trabaja en entornos cambiantes."]},{"t":"viz","v":{"type":"cards","title":["Tipos de dificultades"],"items":[{"i":"bolt","s":"warn","x":["Técnicas"],"d":["Fallos de conexión en una prueba en línea, incompatibilidades entre plataformas."]},{"i":"group","s":"warn","x":["Organizativas"],"d":["Coordinación entre docentes que evalúan a un mismo grupo."]},{"i":"learn","s":"warn","x":["Pedagógicas"],"d":["Adaptar un instrumento diseñado para otro contexto."]}]}},{"t":"p","x":["La resolución eficaz de estos problemas exige, en primer lugar, una actitud de anticipación, similar a la explicada en el capítulo dedicado a la integración de las tecnologías digitales en el proceso de enseñanza-aprendizaje: prever posibles contingencias antes de que se produzcan, disponiendo de alternativas de contingencia para los momentos evaluativos más críticos, como una prueba final sumativa. Exige, además, capacidad de respuesta ágil ante problemas imprevistos, manteniendo la calma y ofreciendo al alumnado instrucciones claras sobre cómo proceder en caso de incidencia técnica durante una prueba. Y exige, finalmente, una actitud de aprendizaje continuo a partir de los problemas experimentados, de manera que cada dificultad afrontada se convierta en una oportunidad para mejorar la planificación de futuras evaluaciones digitales, en coherencia con el enfoque de investigación-acción sobre la propia práctica ya presentado con anterioridad en este manual."]},{"t":"viz","v":{"type":"chain","title":["Resolución eficaz de problemas"],"items":[{"i":"eye","s":"must","x":["Anticipación: planes de contingencia"]},{"i":"clock","s":"must","x":["Respuesta ágil, con calma e instrucciones claras"]},{"i":"cycle","s":"safe","x":["Aprendizaje continuo (investigación-acción)"]}]}},{"t":"p","x":["Muchos de estos problemas, sin embargo, no pueden resolverse de manera exclusivamente individual, sino que requieren de la coordinación en equipo del profesorado implicado en una misma acción formativa. Resulta habitual que distintos docentes evalúen a un mismo grupo de alumnado a lo largo de un mismo periodo formativo, empleando en ocasiones instrumentos y plataformas digitales diferentes. Ante esta realidad, el equipo docente debe acordar de manera conjunta la integración de las tecnologías digitales en los procesos de evaluación de las distintas acciones formativas, estableciendo criterios comunes sobre qué plataformas emplear, cómo comunicar al alumnado los procedimientos de evaluación digital que se seguirán, o cómo compartir de forma coordinada la información relevante sobre el progreso de cada alumno o alumna, evitando así la dispersión de esfuerzos y la posible confusión del alumnado ante criterios contradictorios entre distintos módulos o docentes."]},{"t":"viz","v":{"type":"cards","title":["Qué debe acordar el equipo docente"],"items":[{"i":"laptop","s":"info","x":["Qué plataformas emplear"]},{"i":"megaphone","s":"info","x":["Cómo comunicar al alumnado los procedimientos de evaluación digital"]},{"i":"share","s":"info","x":["Cómo compartir la información sobre el progreso de cada alumno o alumna"]}]}},{"t":"p","x":["Complementariamente, el desarrollo de una competencia digital madura exige que el propio docente sea capaz de emplear las tecnologías digitales de forma autónoma para evaluar la calidad de su propia práctica, entendiendo que la evaluación no debe proyectarse únicamente hacia el alumnado, sino también, de manera reflexiva, hacia la propia actuación profesional. Herramientas digitales como los cuestionarios de satisfacción del alumnado, el análisis de los propios datos de participación registrados en el entorno virtual, o la grabación y posterior revisión de fragmentos de las propias sesiones formativas, constituyen recursos valiosos para que el docente valore de forma autónoma la calidad de la acción formativa que desarrolla y proponga, a partir de dicha valoración, mejoras concretas y fundamentadas."]},{"t":"viz","v":{"type":"cards","title":["Evaluar la calidad de la propia práctica"],"items":[{"i":"checklist","s":"safe","x":["Cuestionarios de satisfacción del alumnado"]},{"i":"chart","s":"safe","x":["Análisis de los datos de participación del entorno virtual"]},{"i":"video","s":"safe","x":["Grabación y revisión de fragmentos de las propias sesiones"]}]}},{"t":"viz","v":{"type":"scene","scene":"meeting","title":["Equipo docente"],"note":["Ilustración que sustituye a la fotografía del manual con el mismo pie."]}}],"acts":["S16-dif","S16-A14"],"videos":[]},{"num":4,"kind":"theory","title":["Seguridad, protección de datos y retroalimentación digital"],"nodes":[{"t":"p","x":["La evaluación digital implica, de manera inevitable, la generación y el almacenamiento de información sensible sobre el alumnado, cuya protección constituye una responsabilidad ineludible del docente. Resulta imprescindible proteger el acceso a la información de los resultados de evaluación almacenados digitalmente, aplicando de forma rigurosa los protocolos de seguridad y protección de datos establecidos por el centro educativo y por la normativa vigente en materia de protección de datos personales. Esta protección se materializa en prácticas concretas como el uso de contraseñas robustas y personales para el acceso a las plataformas de gestión de la evaluación, la limitación del acceso a la información evaluativa exclusivamente al personal docente que la necesita para el desempeño de sus funciones, la evitación de la descarga o el almacenamiento de datos del alumnado en dispositivos personales no autorizados por el centro, o la eliminación de dicha información una vez transcurridos los plazos de conservación establecidos por la normativa."]},{"t":"viz","v":{"type":"cards","title":["Prácticas para proteger la información evaluativa"],"items":[{"i":"lock","s":"must","x":["Contraseñas robustas y personales"]},{"i":"user","s":"must","x":["Acceso solo para el personal docente que lo necesita"]},{"i":"phone","s":"ban","x":["Nada de datos en dispositivos personales no autorizados"]},{"i":"calendar","s":"must","x":["Eliminar los datos al cumplirse los plazos de conservación"]}]}},{"t":"p","x":["Junto a esta dimensión de seguridad, las tecnologías digitales constituyen un canal privilegiado para ofrecer retroalimentación al alumnado a partir de los resultados obtenidos en los distintos instrumentos de evaluación empleados, permitiendo así adaptar la práctica docente a las necesidades detectadas. Esta retroalimentación digital debe respetar, en todo momento, la privacidad de la información facilitada, evitando por ejemplo la exposición pública de calificaciones individuales en espacios digitales de acceso compartido, o la comunicación de información evaluativa sensible a través de canales no seguros. La retroalimentación digital eficaz, como ya se explicó al abordar el acompañamiento al alumnado en el capítulo anterior, debe ser oportuna, específica y orientada a la mejora, características que las tecnologías digitales permiten potenciar de manera notable gracias a la posibilidad de ofrecer comentarios inmediatos tras la realización de una prueba, de personalizar dicha retroalimentación en función del desempeño concreto de cada alumno o alumna, o de emplear formatos variados —comentarios escritos, grabaciones de audio breves, anotaciones sobre el propio documento entregado— que se adapten mejor a las preferencias comunicativas de cada persona."]},{"t":"viz","v":{"type":"compare","title":["Retroalimentación digital y privacidad"],"cols":[{"i":"xmark","s":"ban","x":["Evitar"],"items":[["Exponer calificaciones individuales en espacios de acceso compartido"],["Comunicar información evaluativa sensible por canales no seguros"]]},{"i":"check","s":"safe","x":["Potenciar"],"items":[["Comentarios inmediatos tras la prueba"],["Retroalimentación personalizada según el desempeño"],["Formatos variados: texto, audio breve, anotaciones sobre el documento"]]}]}},{"t":"p","x":["Esta retroalimentación, además, debe traducirse en una adaptación real de la práctica docente. De poco sirve recoger y analizar evidencias digitales sobre el progreso del alumnado si dicha información no se traduce, posteriormente, en ajustes concretos de la planificación didáctica, del ritmo de avance de los contenidos, o de las estrategias de apoyo ofrecidas a quienes presentan mayores dificultades. La coherencia entre la evaluación digital realizada y las decisiones pedagógicas adoptadas a partir de ella constituye, en definitiva, el criterio último que determina si la tecnología ha sido empleada de manera verdaderamente útil en el proceso de enseñanza-aprendizaje."]},{"t":"viz","v":{"type":"key","i":"target","s":"safe","big":["Criterio último"],"x":["La coherencia entre la evaluación digital realizada y las decisiones pedagógicas adoptadas a partir de ella."],"src":["Manual, epígrafe 4"]}},{"t":"links","title":null,"items":[{"i":"shield","x":["Guía para centros educativos (AEPD)"],"d":["Agencia Española de Protección de Datos: tratamiento de datos del alumnado en los centros."],"url":"https://www.aepd.es/guias/guia-centros-educativos.pdf"},{"i":"gavel","x":["Ley Orgánica 3/2018 (LOPDGDD)"],"d":["Protección de Datos Personales y garantía de los derechos digitales (texto consolidado, BOE)."],"url":"https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673"},{"i":"gavel","x":["Reglamento (UE) 2016/679 (RGPD)"],"d":["Reglamento General de Protección de Datos (EUR-Lex, en español)."],"url":"https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679"}]}],"acts":["S16-A15","S16-A15bis"],"videos":[]}],"final":[],"acts":[{"id":"S16-dif","type":"classify","time":["4 min"],"title":["¿Qué tipo de dificultad es?"],"instr":["Clasifica cada dificultad según los tipos que distingue el epígrafe 3."],"cats":[["Técnica"],["Organizativa"],["Pedagógica"]],"items":[{"x":["Se cae la conexión a mitad de una prueba en línea."],"c":0,"exp":["Ejemplo de dificultad técnica."]},{"x":["La plataforma de cuestionarios no es compatible con el entorno virtual del centro."],"c":0,"exp":["Incompatibilidad entre plataformas: técnica."]},{"x":["Tres docentes evalúan al mismo grupo con criterios y plataformas distintos."],"c":1,"exp":["Coordinación entre docentes: organizativa."]},{"x":["Una rúbrica descargada se diseñó para otro nivel y no se ajusta al aula."],"c":2,"exp":["Adaptar un instrumento a la realidad del aula: pedagógica."]}],"block":"S16","origin":"complementaria","ra":"RA4","ce":""},{"id":"S16-A14","type":"teacher","origin":"manual","time":["30 min (propuesta 22 min + puesta en común 8 min)"],"timeManual":["50 minutos"],"kind":["Caso práctico de resolución de problemas"],"group":["Grupal (grupos de tres personas), con puesta en común posterior"],"mode":["Presencial"],"ce":"e), i), h)","title":["Actividad 14. Tres docentes, tres plataformas y una caída del servicio"],"instr":["Se plantea la siguiente situación: en un centro de Formación Profesional, tres docentes distintos imparten módulos formativos a un mismo grupo de alumnado y cada uno de ellos emplea una plataforma digital diferente para las pruebas de evaluación, lo que está generando confusión entre el alumnado sobre plazos, formatos y criterios de corrección. Además, durante la última prueba sumativa realizada por uno de los docentes, la plataforma empleada sufrió una caída del servicio a mitad de la prueba, afectando a varios alumnos. En grupos, elaborad una propuesta conjunta de actuación que incluya: qué acuerdo de coordinación proponéis entre los tres docentes para unificar criterios, y qué protocolo de contingencia establecería el docente afectado por la caída del servicio para resolver de forma justa la incidencia ocurrida durante la prueba sumativa. Presentad vuestra propuesta al resto del grupo-clase."],"fields":[["Componentes del grupo."],["Acuerdo de coordinación entre los tres docentes para unificar criterios (plataformas, plazos, formatos y criterios de corrección)."],["Protocolo de contingencia del docente afectado por la caída del servicio para resolver de forma justa la incidencia."],["Aportaciones de la puesta en común con el grupo-clase."]],"block":"S16","ra":"RA4"},{"id":"S16-A15","type":"teacher","origin":"manual","time":["12 min"],"timeManual":["35 minutos"],"kind":["Prueba teórica y análisis de situaciones"],"group":["Individual"],"mode":["Presencial o virtual"],"ce":"d), j)","title":["Actividad 15. ¿Se ajusta a los criterios de seguridad y retroalimentación?"],"instr":["Analiza las siguientes tres prácticas docentes relacionadas con el tratamiento digital de la información evaluativa y determina, para cada una de ellas, si se ajusta o no a los criterios de seguridad, protección de datos y retroalimentación explicados en este epígrafe, justificando tu respuesta: en la primera, un docente publica en un tablón digital de acceso general a todo el alumnado del centro la relación de calificaciones obtenidas por cada alumno en una prueba sumativa, identificados por su nombre completo; en la segunda, un docente ofrece a cada alumno, a través de un canal privado del entorno virtual, un comentario personalizado sobre los aspectos a mejorar tras la corrección de una actividad; en la tercera, un docente almacena una copia de las calificaciones de su grupo en un dispositivo de almacenamiento personal, no gestionado por el centro, para poder consultarlas con mayor comodidad desde casa."],"fields":[["Primera práctica (calificaciones con nombre completo en un tablón general): ¿se ajusta o no? Justificación."],["Segunda práctica (comentario personalizado por canal privado): ¿se ajusta o no? Justificación."],["Tercera práctica (copia de calificaciones en un dispositivo personal): ¿se ajusta o no? Justificación."]],"solution":[["Primera práctica. No se ajusta a los criterios explicados. La publicación de calificaciones individuales, identificadas por nombre completo, en un tablón de acceso general a todo el alumnado del centro vulnera tanto la protección de la información evaluativa como la privacidad del alumnado afectado, al exponer datos personales sensibles a personas ajenas al proceso de evaluación de ese grupo concreto."],["Segunda práctica. Se ajusta plenamente a los criterios explicados. El comentario personalizado, ofrecido a través de un canal privado del entorno virtual, respeta la privacidad de la información facilitada y constituye un ejemplo de retroalimentación digital oportuna y específica, orientada a la mejora del alumno."],["Tercera práctica. No se ajusta a los criterios explicados. El almacenamiento de las calificaciones en un dispositivo personal no gestionado por el centro incumple el protocolo de seguridad y protección de datos, al sacar la información evaluativa del entorno controlado institucionalmente, con independencia de que la motivación —la comodidad de consulta— no implique intención alguna de causar perjuicio."]],"block":"S16","ra":"RA4"},{"id":"S16-A15bis","type":"teacher","origin":"manual","time":["Fuera de la sesión (actividad alternativa o de refuerzo)"],"timeManual":["35 minutos"],"kind":["Prueba teórica y análisis de situaciones"],"group":["Individual"],"mode":["Presencial o virtual"],"ce":"d), j)","title":["Actividad 15 bis. Tres nuevas prácticas"],"instr":["Analiza las siguientes tres prácticas docentes relacionadas con el tratamiento digital de la información evaluativa y determina, para cada una de ellas, si se ajusta o no a los criterios de seguridad, protección de datos y retroalimentación explicados en este epígrafe, justificando tu respuesta: en la primera, una docente comparte por un grupo de mensajería instantánea, no gestionado por el centro, las calificaciones de una prueba junto con comentarios sobre cada alumno, para que sus compañeros de departamento estén informados; en la segunda, un docente graba un breve audio personalizado para cada alumno con la corrección de su prueba oral, y lo envía de forma individual a través del entorno virtual institucional; en la tercera, una docente exporta los datos de evaluación de su grupo a una hoja de cálculo alojada en un servicio de almacenamiento personal en la nube, no autorizado por el centro, para poder analizarlos con mayor comodidad."],"fields":[["Primera práctica (calificaciones y comentarios en un grupo de mensajería no gestionado por el centro)."],["Segunda práctica (audio personalizado enviado por el entorno virtual institucional)."],["Tercera práctica (datos exportados a una nube personal no autorizada)."]],"rubric":["El manual no incluye solución para esta actividad."],"block":"S16","ra":"RA4"}],"notes":[["El epígrafe 5 del manual no tiene título propio: el índice y la página 51 lo rotulan «5. Actividad 15». La Actividad 15 se trabaja aquí, tras el epígrafe 4, que es al que remite su enunciado."]],"cover":{"signs":[["warn","alert",["Dificultades técnicas, organizativas y pedagógicas"]],["safe","cycle",["Anticipar y aprender"]],["info","handshake",["Acuerdos del equipo docente"]],["must","lock",["Proteger el acceso a la información"]],["safe","chat",["Retroalimentación privada"]]],"lead":["Muchos de estos problemas no pueden resolverse de manera exclusivamente individual, sino que requieren de la coordinación en equipo."]},"art":"handshake"},{"id":"S17","ud":"RA4","title":["Entornos virtuales de gestión de la evaluación, CoRubrics y evaluación final del RA4"],"meta":{"ra_fp":"RA4"},"sections":[{"num":6,"kind":"theory","title":["Entornos virtuales de gestión de la evaluación"],"nodes":[{"t":"p","x":["El último epígrafe de este capítulo aborda la configuración de los entornos virtuales de aprendizaje y sistemas digitales de gestión de la evaluación, elementos que actúan como infraestructura sobre la que se apoyan buena parte de las prácticas descritas en los epígrafes anteriores. Un entorno virtual bien configurado no solo facilita la aplicación de instrumentos de evaluación digitales, sino que garantiza la seguridad de la información, la trazabilidad de los procesos evaluativos y la fluidez de los procesos de retroalimentación entre docente y alumnado."]},{"t":"viz","v":{"type":"cards","num":true,"title":["Funcionalidades para gestionar la evaluación"],"items":[{"i":"chart","s":"info","x":["Sistemas de calificación integrados"],"d":["Registro centralizado de resultados y consulta posterior."]},{"i":"chat","s":"info","x":["Herramientas de retroalimentación integrada"],"d":["Comentarios y correcciones sobre la propia tarea entregada."]},{"i":"history","s":"info","x":["Sistemas de seguimiento del progreso"],"d":["Visión longitudinal y detección temprana de dificultades."]},{"i":"lock","s":"must","x":["Mecanismos de configuración de accesos y permisos"],"d":["Quién puede acceder a cada tipo de información evaluativa."]}]}},{"t":"p","x":["La configuración adecuada de estos entornos requiere que el docente conozca y sepa emplear las funcionalidades específicas que las plataformas educativas ponen a su disposición para la gestión de la evaluación. Entre estas funcionalidades destacan, en primer lugar, los sistemas de calificación integrados, que permiten registrar de forma centralizada los resultados obtenidos por el alumnado en los distintos instrumentos evaluativos empleados a lo largo de la acción formativa, facilitando su consulta posterior tanto por parte del docente como, cuando así se considere oportuno, por parte del propio alumnado."]},{"t":"p","x":["En segundo lugar, las herramientas de retroalimentación integrada, que permiten al docente incorporar comentarios, valoraciones o correcciones directamente sobre las tareas entregadas por el alumnado dentro del propio entorno virtual, evitando la dispersión de esta información en canales paralelos."]},{"t":"p","x":["En tercer lugar, los sistemas de seguimiento del progreso, que ofrecen una visión longitudinal del desempeño de cada alumno o alumna a lo largo del tiempo, facilitando la identificación temprana de dificultades persistentes."]},{"t":"p","x":["Y, en cuarto lugar, los mecanismos de configuración de accesos y permisos, que permiten al docente determinar con precisión quién puede acceder a cada tipo de información evaluativa, garantizando así el cumplimiento de los protocolos de seguridad y protección de datos ya explicados."]},{"t":"p","x":["La correcta configuración de un entorno virtual orientado a la gestión de la evaluación no es, en ningún caso, una tarea meramente técnica y ajena a la reflexión pedagógica. Por el contrario, exige del docente una planificación previa cuidadosa, en la que se determine con claridad qué información evaluativa se recogerá, cómo se estructurará dentro del entorno, quién tendrá acceso a ella, y de qué manera se garantizará que dicha configuración favorezca, y no dificulte, los procesos de retroalimentación y de mejora continua que constituyen la finalidad última de toda evaluación educativa. Un entorno virtual bien diseñado se convierte, en este sentido, en un aliado imprescindible del docente competente digitalmente, mientras que un entorno mal configurado puede generar más problemas de los que resuelve, con independencia de la sofisticación técnica de la plataforma empleada."]}],"acts":["S17-eva"],"videos":[]},{"num":7,"kind":"theory","title":["CoRubrics (con Padlet para seguimiento grupal)"],"nodes":[{"t":"h3","x":["Funciones principales"]},{"t":"p","x":["CoRubrics es un complemento de Google Sheets que automatiza la creación y aplicación de rúbricas de evaluación a partir de un formulario de Google Forms, permitiendo evaluación por parte del docente, autoevaluación del alumnado o coevaluación entre compañeros. Padlet es una aplicación de mural digital colaborativo donde varios usuarios pueden publicar contenidos (texto, imágenes, enlaces, documentos) en un espacio compartido y visible en tiempo real."]},{"t":"h3","x":["Ventajas"]},{"t":"list","k":"ul","l":1,"items":[["CoRubrics automatiza el cálculo de calificaciones a partir de los criterios de la rúbrica, reduciendo el tiempo de corrección manual."],["Permite comparar de forma sencilla la autoevaluación del alumnado con la evaluación del docente, favoreciendo la reflexión sobre el propio aprendizaje."],["Padlet ofrece una visión de conjunto del progreso de varios grupos de trabajo simultáneamente, sin necesidad de revisar documentos individuales dispersos."],["Ambas herramientas se integran con facilidad en entornos ya existentes (Google Workspace, Moodle), sin requerir infraestructura adicional."]],"start":1},{"t":"h3","x":["Cómo ayuda al docente"]},{"t":"p","x":["Sistematiza la evaluación de competencias mediante criterios explícitos y medibles, lo que aporta transparencia y objetividad frente al alumnado. El uso combinado con Padlet permite, además, hacer u
